on:
  pull_request:
    branches:
      - main
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

name: test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting & linting of whole project
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Type validator
        run: bun run validate
