on:
  workflow_call: {}
name: publish
permissions:
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: NPM Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: "" # To disable NPM Token authentication and use OIDC authentication
